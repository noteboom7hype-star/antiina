<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pluvie</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
margin:0;
font-family:"Comic Sans MS", cursive;
background:linear-gradient(135deg,#1a0d05,#2b1406,#140701);
color:white;
overflow:hidden;
}

/* SPLASH */

#splash{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(circle at center,#5a2608,#140701);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:999;
overflow:hidden;
transition:.7s;
}

/* FUNDO GIRANDO */

#splash::before{
content:"";
position:absolute;
width:200%;
height:200%;
background:conic-gradient(
from 0deg,
rgba(255,170,80,.15),
rgba(255,120,0,.35),
rgba(255,80,0,.15),
rgba(255,170,80,.15)
);
animation:rotateSplash 18s linear infinite;
filter:blur(120px);
pointer-events:none;
}

@keyframes rotateSplash{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

/* LOGO */

.logo{
font-size:70px;
background:linear-gradient(90deg,#ffd4a3,#ff7a00);
-webkit-background-clip:text;
color:transparent;
letter-spacing:2px;
z-index:2;
position:relative;
}

/* TEXTO SPLASH */

.typing{
margin:20px;
opacity:.8;
font-size:18px;
z-index:2;
position:relative;
}

/* TRANSIÇÃO BRANCA */

#whiteTransition{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
opacity:0;
pointer-events:none;
z-index:998;
transition:.8s ease;
}

/* BOTÕES */

button{
background:linear-gradient(90deg,#ff7a00,#ff4d00);
border:none;
padding:12px 26px;
border-radius:12px;
color:white;
cursor:pointer;
font-size:16px;

font-family:"Comic Sans MS", cursive;
font-style:italic;

transition:.25s;
box-shadow:0 0 10px rgba(255,120,0,.4);
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 18px rgba(255,120,0,.7);
}

/* SIDEBAR */

.sidebar{
position:fixed;
width:240px;
height:100vh;
background:rgba(45,20,8,.55);
backdrop-filter:blur(12px);
padding-top:30px;
box-shadow:4px 0 25px rgba(0,0,0,.6);
border-right:1px solid rgba(255,120,0,.25);
}

.sidebar h2{
text-align:center;
color:#ffb066;
}

/* LINKS */

.sidebar a{
display:flex;
align-items:center;
gap:12px;
padding:15px 28px;
text-decoration:none;
color:white;
transition:.25s;
cursor:pointer;
position:relative;
font-style:italic;
}

.sidebar a:hover{
background:rgba(255,120,0,.12);
transform:translateX(6px);
}

.sidebar a::before{
content:"";
position:absolute;
left:0;
top:0;
height:100%;
width:0px;
background:linear-gradient(#ffb066,#ff7a00);
transition:.25s;
}

.sidebar a:hover::before{
width:4px;
}

.sidebar a.active{
background:rgba(255,120,0,.18);
}

.sidebar a.active::before{
width:4px;
}

.sidebar a.active i{
color:#ffb066;
}

/* CONTENT */

.content{
margin-left:240px;
padding:50px;
animation:fade .4s ease;
}

/* CARDS */

.card{
background:rgba(40,18,6,.55);
backdrop-filter:blur(14px);
padding:35px;
border-radius:20px;
box-shadow:0 0 35px rgba(0,0,0,.4);
margin-bottom:25px;
transition:.35s;
border:1px solid rgba(255,120,0,.2);
}

.card:hover{
transform:translateY(-6px) scale(1.01);
box-shadow:0 10px 45px rgba(255,120,0,.25);
}

/* INPUT */

input{
padding:12px;
margin:10px;
background:#2a1204;
border:1px solid #ff7a00;
border-radius:10px;
color:white;
font-family:"Comic Sans MS", cursive;
}

/* FOOTER */

footer{
position:fixed;
bottom:10px;
right:15px;
font-size:12px;
opacity:.6;
}

.hidden{
display:none;
}

@keyframes fade{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;}
}

</style>
</head>

<body>

<div id="splash">
<div class="logo">Pluvie</div>
<div class="typing" id="typing"></div>
<button onclick="enter()">Entrar</button>
</div>

<div id="whiteTransition"></div>

<div id="sidebar" class="sidebar hidden">

<h2>Pluvie</h2>

<a onclick="page('home',this)" class="active">
<i class="fa-solid fa-house"></i> Home
</a>

<a onclick="page('web',this)">
<i class="fa-solid fa-tv"></i> WebTV
</a>

<a onclick="page('rec',this)">
<i class="fa-solid fa-satellite-dish"></i> Receptores
</a>

<a onclick="page('admin',this)">
<i class="fa-solid fa-shield-halved"></i> Admin
</a>

</div>

<div id="content" class="content hidden">

<div id="home">
<div class="card">
<h1>Bem-vindo</h1>
<p>Painel Pluvie carregado com sucesso.</p>
</div>
</div>

<div id="web" class="hidden">
<div class="card">
<h1>NickOnline</h1>
<button onclick="window.open('https://x1co.com.br:8443/')">
Abrir player
</button>
</div>
</div>

<div id="rec" class="hidden">
<div class="card">
<h1>Receptores</h1>
<p>Em breve...</p>
</div>
</div>

<div id="admin" class="hidden">
<div class="card">

<h1>Login Admin</h1>

<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">

<br>

<button onclick="login()">Entrar</button>
<button onclick="logout()">Logout</button>

<div id="painel" class="hidden">
<hr>
<h2>Painel admin ativo</h2>
<p>Status: Online</p>
</div>

</div>
</div>

</div>

<footer>Pluvie v2.3</footer>

<script>

const splash=document.getElementById("splash");
const sidebar=document.getElementById("sidebar");
const content=document.getElementById("content");
const typing=document.getElementById("typing");
const whiteTransition=document.getElementById("whiteTransition");

let texto="The antenna that no one's ever seen";
let i=0;

function digitar(){
if(i<texto.length){
typing.textContent+=texto[i];
i++;
setTimeout(digitar,50);
}
}

window.onload=digitar;

function enter(){

whiteTransition.style.opacity="1";

setTimeout(()=>{

whiteTransition.style.opacity="0";
splash.style.opacity="0";

setTimeout(()=>{

splash.style.display="none";
sidebar.classList.remove("hidden");
content.classList.remove("hidden");

},500);

},300);

}

function page(p,element){

["home","web","rec","admin"]
.forEach(x=>document.getElementById(x).classList.add("hidden"));

document.getElementById(p).classList.remove("hidden");

document.querySelectorAll(".sidebar a")
.forEach(link=>link.classList.remove("active"));

element.classList.add("active");

}

</script>

</body>
</html>
